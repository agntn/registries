packages:
  - docs

gitChecks: false

allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  core-js-pure: false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  vue-demi: true
  workerd: true

# A frozen install refuses day-old releases. The @agntn glob keeps CI green the day a sibling ships.
minimumReleaseAgeExclude:
  - "@agntn/*"

# One version per name, shared by the library and docs/, which bundles the library from ../src.
catalogs:
  deps:
    "@agntn/tools": 0.2.4
    "@modelcontextprotocol/sdk": 1.30.1
    "@modelcontextprotocol/server": 2.2.0
    "@nuxtjs/mcp-toolkit": 0.19.0
    agents: 0.26.0
    better-sqlite3: 12.11.1
    docus: 5.13.0
    h3: 1.15.11
    nuxt: 4.5.2
    ohash: 2.0.12
    ufo: 1.6.4
    unstorage: 1.17.5
    zod: 4.5.4
  dev:
    "@agntn/ox": 0.1.0
    "@earendil-works/pi-coding-agent": 0.84.2
    "@iconify-json/lucide": 1.2.136
    "@iconify-json/simple-icons": 1.2.97
    "@iconify-json/vscode-icons": 1.2.81
    "@modelcontextprotocol/client": 2.2.0
    "@nuxt/content": 3.16.0
    "@nuxt/ui": 4.11.0
    "@oh-my-pi/omptype": 18.0.11
    "@oh-my-pi/pi-coding-agent": 18.0.11
    "@types/node": 26.6.5
    "@vueuse/core": 14.4.0
    ai: 7.0.140
    changelogen: 0.6.2
    nuxtseo-layer-devtools: 5.3.16
    obuild: 0.4.40
    oxfmt: 0.65.0
    oxlint: 1.80.0
    oxlint-tsgolint: 7.0.2003
    shiki: 4.4.3
    typebox: 1.3.34
    typescript: 5.9.3
    vite: 7.3.1
    vitest: 4.1.12
    wrangler: 4.128.0

cleanupUnusedCatalogs: true

# Vitest stays on the root's Vite 7, Nuxt keeps its Vite 8. Shared peers would put one of them on the wrong major.
resolvePeersFromWorkspaceRoot: false

# Keeps pnpm 12's env document out of the lockfile. GitHub reads that one as zero dependencies.
pmOnFail: ignore
