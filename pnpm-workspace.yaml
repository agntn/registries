packages:
  - docs

gitChecks: false

allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  core-js-pure: false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  vue-demi: true
  workerd: true

# A frozen install refuses day-old releases. The @agntn glob keeps CI green the day a sibling ships.
minimumReleaseAgeExclude:
  - "@agntn/*"

# One version per name, shared by the library and docs/, which bundles the library from ../src.
catalogs:
  deps:
    "@agntn/hashes": 0.7.3
    "@agntn/tools": 0.3.3
    "@modelcontextprotocol/sdk": 1.32.2
    "@modelcontextprotocol/server": 2.4.0
    "@nuxtjs/mcp-toolkit": 0.24.3
    agents: 0.33.0
    better-sqlite3: 12.11.1
    docus: 5.15.0
    h3: 1.15.11
    nuxt: 4.6.4
    ohash: 2.0.12
    ufo: 1.6.4
    unstorage: 1.17.5
    zod: 4.6.7
  dev:
    "@agntn/ox": 0.1.0
    "@earendil-works/pi-coding-agent": 0.84.4
    "@iconify-json/lucide": 1.2.157
    "@iconify-json/simple-icons": 1.2.103
    "@iconify-json/vscode-icons": 1.2.99
    "@modelcontextprotocol/client": 2.4.0
    "@nuxt/content": 3.16.2
    "@nuxt/ui": 4.12.2
    "@oh-my-pi/omptype": 18.0.11
    "@oh-my-pi/pi-coding-agent": 18.0.11
    "@types/node": 26.6.5
    "@vueuse/core": 14.4.0
    ai: 7.0.140
    nuxtseo-layer-devtools: 5.3.16
    obuild: 0.4.40
    oxlint-tsgolint: 7.0.2007
    shiki: 4.6.0
    typebox: 1.4.7
    typescript: 5.9.3
    vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
    vite-plus: 1.7.0
    wrangler: 4.162.0

cleanupUnusedCatalogs: true

# Shared peers would hand docs/ the root's MCP client, and `agents` wants its own.
resolvePeersFromWorkspaceRoot: false

# Keeps pnpm 12's env document out of the lockfile. GitHub reads that one as zero dependencies.
pmOnFail: ignore

overrides:
  vite@*: catalog:dev
